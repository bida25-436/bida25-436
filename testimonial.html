                <section>
 <h2>Send Me a Message</h2>
        <form action="https://formspree.io/f/xaqprnld" method="POST">
            <div>
                <label for="name">Your Name:</label><br>
                <input type="text" id="name" name="name" required>
            </div>
            <br>
            <div>
                <label for="email">Your Email:</label><br>
                <input type="email" id="email" name="email" required>
            </div>
            <br>
            <div>
                <label for="message">Your Message:</label><br>
                <textarea id="message" name="message" rows="5" cols="30" required></textarea>
            </div>
            <br>
            <button type="submit">Send Message</button>
        </form>
        <p><small>Note: To make the form work, sign up for free at <a href="https://formspree.io" target="_blank">Formspree</a> and replace the form action URL.</small></p>
